# 限流 key 取真實客戶端 IP：本站經 Cloudflare → Traefik 代理，$remote_addr 只是代理 IP。
# 優先順序：CF-Connecting-IP（Cloudflare 強制覆寫、走 CF 的流量不可偽造）
#          → X-Forwarded-For（非 CF 路徑的備援，第一段可能被客戶端偽造）
#          → $binary_remote_addr（直連）
map $http_x_forwarded_for $xff_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
map $http_cf_connecting_ip $limit_key {
    ""      $xff_key;
    default $http_cf_connecting_ip;
}
# API 每客戶端 20 r/s（burst 40）；WS 每客戶端最多 10 條連線
limit_req_zone $limit_key zone=api_limit:10m rate=20r/s;
limit_conn_zone $limit_key zone=ws_conn:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全標頭
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 前端為同源打包（JS/CSS 於 /assets），WebSocket 走 wss:// 同站
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'" always;
    # index.html 不可進快取：否則瀏覽器「啟發式快取」抓舊 HTML → 引用舊 bundle（immutable 一年）→ 改版不生效。
    # /assets/ 有自己的 location add_header（不可變長快取），不受此影響。
    add_header Cache-Control "no-cache" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資產可長快取（Vite 檔名含 hash）；location 內 add_header 不繼承 server 層，需重複安全標頭
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API proxy to backend
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # K線日線資料較大，加大 proxy buffer 避免寫入暫存檔
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # WebSocket proxy to backend
    location /ws/ {
        limit_conn ws_conn 10;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 盤中有推播會持續刷新；閒置 1 小時後斷線由前端自動重連
        proxy_read_timeout 3600;
    }
}
