# 正式環境 — Coolify Docker Compose 部署
# Coolify 設定：Build Pack → Docker Compose → Location 指定此檔案
# 在 Coolify UI 為 frontend service 指派網域
# 不定義自訂 networks（Coolify 自動管理，自訂會導致 Traefik 路由問題）
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 入口以 root 修正 /data 擁有權後即降權為 appuser（見 backend/entrypoint.sh）
    security_opt:
      - no-new-privileges:true
    environment:
      - DUCKDB_PATH=/data/taiex.duckdb
      # Coolify 依 frontend service 指派的網域自動產生（含 scheme，如 https://taiex.mkinweb.com）
      - CORS_ORIGINS=${SERVICE_URL_FRONTEND}
      # 可在 Coolify 環境變數 UI 設定（選填）
      - FINMIND_TOKEN=${FINMIND_TOKEN:-}
      - WS_MAX_CONNECTIONS=${WS_MAX_CONNECTIONS:-200}
    volumes:
      - type: volume
        source: db-data
        target: /data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # nginx master 需 root 綁 port 80 與切換 worker 身分；僅保留最小權限
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICE_URL_FRONTEND_80
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
